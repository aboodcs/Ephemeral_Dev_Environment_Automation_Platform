name: Environment Destroy
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type destroy to confirm"
        required: true
        type: string
  schedule:
    - cron: "0 15 * * 1-5"
concurrency:
  group: dev-environment
  cancel-in-progress: false
permissions:
  contents: read
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_allowed_ssh_cidr: ${{ vars.TF_VAR_allowed_ssh_cidr }}
  TF_VAR_ssh_public_key_path: ${{ vars.TF_VAR_ssh_public_key_path }}
jobs:
  destroy:
    name: Destroy Environment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aws/environment
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Confirm Destroy
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "destroy" ]; then
            echo "Wrong confirmation"
            exit 1
          fi
      - name: AWS Authentication
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v4
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"
      - name: Terraform Destroy
        run: |
          terraform destroy \
            -input=false \
            -auto-approve
      - name: Slack Notification - Environment Destroyed
        if: success()
        run: |
          curl -X POST \
          -H 'Content-type: application/json' \
          --data "{
            \"text\":\"🗑️ Environment Destroyed\n\nEnvironment: ${{ vars.ENVIRONMENT_NAME }}\nOwner: ${{ vars.OWNER_NAME }}\nStatus: Destroyed\n\nAWS Region: ${{ env.AWS_REGION }}\nDestroyed At: $(date -u '+%Y-%m-%d %H:%M:%S UTC')\n\nTrigger: ${{ github.event_name }}\nWorkflow Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Slack Notification - Destroy Failed
        if: failure()
        run: |
          curl -X POST \
          -H 'Content-type: application/json' \
          --data "{
            \"text\":\"❌ Environment Destroy Failed\n\nEnvironment: ${{ vars.ENVIRONMENT_NAME }}\nOwner: ${{ vars.OWNER_NAME }}\nRegion: ${{ env.AWS_REGION }}\nTime: $(date -u '+%Y-%m-%d %H:%M:%S UTC')\n\nTrigger: ${{ github.event_name }}\nWorkflow Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}