name: Environment Start
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1-5"
concurrency:
  group: dev-environment
  cancel-in-progress: false
permissions:
  contents: read
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_allowed_ssh_cidr: ${{ vars.TF_VAR_allowed_ssh_cidr }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
jobs:
  terraform-apply:
    name: Start Environment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aws/environment
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: AWS Authentication
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v4
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"
      - name: Terraform Validate
        run: terraform validate
      - name: Terraform Plan
        run: terraform plan -input=false -out=start.tfplan
      - name: Terraform Apply
        run: terraform apply -auto-approve start.tfplan
      - name: Get Environment Information
        id: environment_info
        run: |
          echo "PUBLIC_IP=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT
          echo "APP_URL=$(terraform output -raw app_url)" >> $GITHUB_OUTPUT
          echo "START_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
      - name: Slack Notification - Environment Started
        if: success()
        run: |
          curl -X POST \
          -H 'Content-type: application/json' \
          --data "{
            \"text\":\"✅ Environment Started\n\nEnvironment: ${{ vars.ENVIRONMENT_NAME }}\nOwner: ${{ vars.OWNER_NAME }}\nStatus: Running\n\nAWS Region: ${{ env.AWS_REGION }}\nEC2 Public IP: ${{ steps.environment_info.outputs.PUBLIC_IP }}\nApplication URL: ${{ steps.environment_info.outputs.APP_URL }}\n\nStarted At: ${{ steps.environment_info.outputs.START_TIME }}\nScheduled Destroy: 18:00 Jordan Time (15:00 UTC)\nExpiration: 10 hours\n\nTrigger: ${{ github.event_name }}\nWorkflow Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Slack Notification - Start Failed
        if: failure()
        run: |
          curl -X POST \
          -H 'Content-type: application/json' \
          --data "{
            \"text\":\"❌ Environment Start Failed\n\nEnvironment: ${{ vars.ENVIRONMENT_NAME }}\nOwner: ${{ vars.OWNER_NAME }}\nRegion: ${{ env.AWS_REGION }}\nTime: $(date -u '+%Y-%m-%d %H:%M:%S UTC')\n\nTrigger: ${{ github.event_name }}\nWorkflow Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}